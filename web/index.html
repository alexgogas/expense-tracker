<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>
<!-- Chart.js and xlsx (SheetJS) are both npm dependencies (chart.js/auto, xlsx), imported
     directly by the components that use them — no CDN script needed for either. -->
<script src="./categorization-engine.js"></script>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --panel-2: #1e232b;
    --border: #2a303a;
    --text: #e8eaed;
    --text-dim: #9aa4b2;
    --accent: #5eb1ff;
    --accent-2: #7ee8b8;
    --danger: #ff6b6b;
    --warn: #ffb454;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky; top: 0; z-index: 25;
    flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  header .sub { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
  #signin-area { display: flex; align-items: center; gap: 12px; }
  #user-chip { display: none; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); }
  #user-chip img { width: 24px; height: 24px; border-radius: 50%; }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 8px 14px;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: #262c35; border-color: #3a4250; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1420; font-weight: 600; }
  button.primary:hover { background: #4aa0f2; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { margin: 0 0 14px; font-size: 15px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; }
  .card > summary { cursor: pointer; list-style: none; }
  .card > summary::-webkit-details-marker { display: none; }
  .card > summary h2::before {
    content: '▸'; display: inline-block; margin-right: 8px;
    color: var(--text-dim); font-size: 11px; transition: transform 0.15s;
  }
  .card[open] > summary h2::before { transform: rotate(90deg); }
  #status-line { color: var(--text-dim); font-size: 13px; margin-bottom: 8px; min-height: 18px; }

  .stat-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .stat {
    flex: 1;
    min-width: 140px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; }
  .stat .value { font-size: 22px; font-weight: 600; margin-top: 4px; }

  #chart-wrap { position: relative; height: 340px; margin-top: 16px; }
  #breadcrumb-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--text-dim); }
  #breadcrumb-row button { padding: 4px 10px; font-size: 12px; }
  #breadcrumb-label { color: var(--accent); }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 28px;
    text-align: center;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(94,177,255,0.05); }
  .drop-zone input { display: none; }
  .format-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .format-pill {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
  }
  .format-pill.active { border-color: var(--accent); color: var(--accent); background: rgba(94,177,255,0.08); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.4px; }
  select.cat-select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 13px;
  }
  #notes-textarea {
    width: 100%;
    min-height: 160px;
    resize: vertical;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.5;
    box-sizing: border-box;
  }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
  .badge.new { background: rgba(255,180,84,0.15); color: var(--warn); }
  .badge.matched { background: rgba(126,232,184,0.15); color: var(--accent-2); }

  #range-filter-row, #networth-range-filter-row, .mortgage-model-row { display: flex; align-items: center; gap: 18px; margin-top: 14px; font-size: 13px; color: var(--text-dim); flex-wrap: wrap; }
  #range-filter-row label, #networth-range-filter-row label, .mortgage-model-row label { display: flex; align-items: center; gap: 6px; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { color: var(--text); }
  th.sortable .sort-arrow { color: var(--accent); margin-left: 4px; }

  #unsaved-changes-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 10px 0; padding: 10px 14px;
    background: rgba(255,180,84,0.08); border: 1px solid var(--warn); border-radius: 8px;
    font-size: 13px; color: var(--warn);
  }

  .cat-tree-row { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .cat-tree-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 12px; background: var(--panel-2); }
  .cat-tree-name { font-weight: 600; font-size: 13px; }
  .cat-tree-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .cat-tree-actions button { padding: 4px 10px; font-size: 12px; }
  .cat-tree-subs { padding: 4px 12px 8px 28px; }
  .cat-tree-sub-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 8px 0; font-size: 13px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
  .cat-tree-sub-row:last-child { border-bottom: none; }
  .cat-tree-sub-row .cat-tree-actions button { padding: 2px 8px; font-size: 11px; }

  .budget-row-right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .budget-actual { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .budget-bar-wrap { width: 90px; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; flex-shrink: 0; }
  .budget-bar { display: block; height: 100%; border-radius: 4px; }
  .budget-pct { font-size: 12px; white-space: nowrap; }
  .budget-input {
    width: 80px; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 13px; text-align: right;
  }
  .budget-period-select {
    background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 6px; font-size: 12px;
  }

  .balance-grid-table { border-collapse: collapse; font-size: 13px; white-space: nowrap; }
  .balance-grid-table th, .balance-grid-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: right; }
  .balance-grid-table th:first-child, .balance-grid-table td:first-child { text-align: left; position: sticky; left: 0; background: var(--panel); }
  .balance-grid-table th { color: var(--text-dim); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.4px; }
  .balance-input {
    width: 100px; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 13px; text-align: right;
  }

  details.cat-group { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  details.cat-group > summary {
    cursor: pointer; padding: 10px 12px; background: var(--panel-2);
    list-style: none; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    font-size: 13px; gap: 6px 12px;
  }
  details.cat-group > summary::-webkit-details-marker { display: none; }
  details.cat-group > summary .name { color: var(--text); font-weight: 600; }
  details.cat-group > summary .meta { color: var(--text-dim); font-size: 12px; }
  details.cat-group > summary .caret { display: inline-block; margin-right: 6px; color: var(--text-dim); transition: transform 0.15s; }
  details.cat-group[open] > summary .caret { transform: rotate(90deg); }
  details.cat-group .sub-group { margin: 8px 12px; }
  details.cat-group table { margin: 0 12px 12px; width: calc(100% - 24px); }
  details.cat-group .sub-group table { margin: 0 0 10px; width: 100%; }
  details.cat-group tr.selected td { background: rgba(94, 177, 255, 0.10); }
  .bulk-bar {
    position: sticky; top: var(--header-h, 0px); z-index: 5;
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    margin: 10px 0; padding: 8px 12px; font-size: 13px;
    background: var(--panel-2); border: 1px solid var(--accent); border-radius: 8px;
  }
  .bulk-bar .bulk-hint { color: var(--text-dim); font-size: 12px; }
  .table-scroll { overflow-x: auto; }

  #signed-out-msg, #no-folder-msg { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  #signed-out-msg h2, #no-folder-msg h2 { color: var(--text); font-size: 20px; margin-bottom: 8px; }
  .hidden { display: none !important; }
  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 12px 18px; border-radius: 8px; font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    max-width: 320px;
  }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.success { border-color: var(--accent-2); color: var(--accent-2); }

  .spinner {
    display: inline-block; width: 14px; height: 14px; flex-shrink: 0;
    border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; vertical-align: -2px;
  }
  .spinner.large { width: 32px; height: 32px; border-width: 3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  #loading-panel { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 80px 20px; color: var(--text-dim); font-size: 14px; }
  .icon-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; padding: 7px; line-height: 0; }
  .icon-btn.active { border-color: var(--accent); color: var(--accent); }
  .icon-badge { position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  button.format-pill { background: transparent; }
  .link-btn { background: none; border: none; padding: 0; color: var(--accent); font-size: inherit; cursor: pointer; text-decoration: underline; }
  .link-btn:hover { background: none; }
  .panel-hint { color: var(--text-dim); font-size: 13px; line-height: 1.5; margin: 0 0 14px; }
  .settings-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .settings-heading { font-size: 14px; margin: 22px 0 6px; }
  .settings-heading:first-child { margin-top: 0; }

  .overlay-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .overlay-header h2 { margin: 0; font-size: 15px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; }
  .modal-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,0.55); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto; }
  .modal { width: min(900px, 100%); background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); outline: none; }
  .side-panel { position: fixed; top: var(--header-h, 0px); right: 0; bottom: 0; z-index: 20; width: min(440px, 100vw); overflow-y: auto; background: var(--panel); border-left: 1px solid var(--border); padding: 20px; box-shadow: -8px 0 32px rgba(0,0,0,0.4); outline: none; }
  @media (min-width: 1200px) { main.with-panel { margin-right: 440px; } }

  .budget-progress { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 12px; }
  .budget-progress > summary { cursor: pointer; font-size: 13px; color: var(--text-dim); }
  /* One grid for every row (rows are subgrids), so bars start and end at the same x regardless of
     how long each row's name or amount text is. */
  .progress-list { display: grid; grid-template-columns: minmax(100px, max-content) minmax(80px, 1fr) max-content max-content; column-gap: 14px; }
  .progress-row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; row-gap: 4px; padding: 7px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
  .progress-row:last-child { border-bottom: none; }
  .progress-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .progress-track { position: relative; height: 8px; background: var(--panel-2); border-radius: 4px; }
  .progress-fill { display: block; height: 100%; border-radius: 4px; }
  .progress-fill.clipped { border-radius: 4px 0 0 4px; -webkit-mask-image: linear-gradient(to right, #000 85%, transparent); mask-image: linear-gradient(to right, #000 85%, transparent); }
  .progress-limit { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--text-dim); border-radius: 1px; }
  .progress-pct { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .progress-row .budget-actual { text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 600px) {
    .progress-list { grid-template-columns: minmax(80px, max-content) minmax(60px, 1fr) max-content; }
    .progress-row .budget-actual { grid-column: 1 / -1; text-align: left; }
  }

  #busy-pill {
    position: fixed; top: calc(var(--header-h, 0px) + 12px); left: 50%; transform: translateX(-50%); z-index: 26;
    display: flex; align-items: center; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 16px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>
<div id="app-root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
